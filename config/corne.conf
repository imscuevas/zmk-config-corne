# Enable pointing device support
CONFIG_ZMK_POINTING=y

# Enable display support
CONFIG_ZMK_DISPLAY=y

# Show battery percentage on the display
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Set the keyboard name
CONFIG_ZMK_KEYBOARD_NAME="CORNE-KBD"

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
# Enable deep sleep support (disconnects BLE after inactivity to save battery)
CONFIG_ZMK_SLEEP=y

# Time to wait before entering deep sleep (900,000 ms = 15 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Enable external power control (cuts power to OLED/peripherals on sleep)
CONFIG_ZMK_EXT_POWER=y
